version: '2'

linters:
  default: all
  disable:
    - exhaustruct_v5 # is only intended for use in special cases.
    - noinlineerr    # personal preference
    - recvcheck
    - exhaustruct    # deprecated and replaced by exhaustruct_v5
    - gomodguard     # deprecated and replaced by gomodguard_v2
    - wsl            # deprecated and replaced by wsl_v5
  settings:
    depguard:
      # Only allow imports from the stdlib & this module
      rules:
        all:
          list-mode: strict
          files:
            - $all
          allow:
            - $gostd
            - github.com/percivalalb/sipuri/v2
    varnamelen:
      max-distance: 17 # default of 5 makes the linter annoying to use.
  exclusions:
    generated: lax
    rules:
      # exclude some linters on test files.
      - linters:
          - funlen # some test functions can be long.
          - goconst
        path: _test\.go
      - linters:
          - golint
          - revive
        text: returns unexported type.*sipuri\.uriOption
      - linters:
          - revive
        text: 'package-comments: should have a package comment'
        path: internal/*
      - linters:
          - ireturn
        path: sipuri\.go
      - linters:
          - cyclop
          - gocognit
        text: 'func(tion)? `?Fuzz'
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
